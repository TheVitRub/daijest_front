name: Deploy frontend

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: daijest-production-deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout frontend
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check JavaScript syntax
        run: node --check app.js

      - name: Deploy frontend over SSH
        shell: bash
        run: |
          set -euo pipefail

          mkdir -p ~/.ssh
          printf '%s\n' "${{ secrets.SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.SSH_HOST }}" >> ~/.ssh/known_hosts

          ssh -i ~/.ssh/deploy_key "${{ secrets.SSH_USER }}@${{ secrets.SSH_HOST }}" 'bash -s' <<'REMOTE'
          set -Eeuo pipefail

          APP_DIR="$HOME/daijest"
          mkdir -p "$APP_DIR"
          cd "$APP_DIR"
          test -f .env
          test -f docker-compose.yml

          exec 9>.deploy.lock
          flock 9

          REPO_URL="git@github.com-daijest-frontend:TheVitRub/daijest_front.git"

          if [ ! -d frontend/.git ]; then
            git clone --branch main "$REPO_URL" frontend
          else
            git -C frontend remote set-url origin "$REPO_URL"
            git -C frontend fetch --prune origin main
            git -C frontend reset --hard origin/main
          fi

          docker compose -p daijest build frontend
          docker compose -p daijest up -d --no-build --force-recreate --remove-orphans frontend
          docker compose -p daijest ps
          REMOTE

