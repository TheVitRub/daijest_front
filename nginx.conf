server {
  listen 80;
  server_name _;

  root /usr/share/nginx/html;
  index digest-builder.html;
  client_max_body_size 32m;

  location /api/ {
    proxy_pass http://backend:8080/api/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location /healthz {
    proxy_pass http://backend:8080/healthz;
  }

  location = /daijest/register {
    try_files /register.html =404;
  }

  location = /daijest/register.html {
    try_files /register.html =404;
  }

  # App code (JS/CSS): always revalidate so fixes land without a hard refresh.
  # ETag/Last-Modified make this cheap (304 when unchanged).
  location ~* \.(?:js|css)$ {
    try_files $uri =404;
    add_header Cache-Control "no-cache";
  }

  # Static assets that rarely change stay cacheable.
  location ~* \.(?:png|jpg|jpeg|gif|svg|webp|ico|woff2?|ttf)$ {
    try_files $uri =404;
  }

  location / {
    try_files $uri $uri/ /digest-builder.html;
    add_header Cache-Control "no-cache";
  }
}
